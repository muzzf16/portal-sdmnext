version: '3.8'

services:
  backend:
    build:
      context: ./apps/backend
    container_name: portal_sdm_backend
    restart: unless-stopped
    ports:
      - "3334:3333"
    environment:
      - PORT=3333
      - NODE_ENV=production
      - DB_SOURCE=/data/database.sqlite
      - JWT_SECRET=${JWT_SECRET:-default_secret_please_change}
      - CORS_ORIGIN=http://192.168.0.210:8081,https://sdm.bprbaperabatang.com,http://10.138.0.90:8081,http://10.138.0.10:8081
    networks:
      - bpr-network # Connect to shared network
    volumes:
      - backend_data:/data
      - backend_uploads:/app/public

  sdm:
    # Renamed from 'frontend' to 'sdm' to match http://sdm:8081
    build:
      context: ./apps/frontend
    container_name: portal_sdm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:8081" # Map 8081 (Host) -> 8081 (Container)
    networks:
      - bpr-network # Connect to shared network

  sqlite-web:
    image: coleifer/sqlite-web:latest
    container_name: sqlite-web
    profiles:
      - monitoring
    ports:
      - "8088:8080"
    volumes:
      - backend_data:/data
    environment:
      - SQLITE_DATABASE=database.sqlite
    restart: unless-stopped

  adminer-sqlite:
    image: adminer:latest
    container_name: adminer-sqlite
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - backend_data:/data
    restart: unless-stopped

networks:
  bpr-network:
    name: bpr_shared_network
    driver: bridge

volumes:
  backend_data:
  backend_uploads:
